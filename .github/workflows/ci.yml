# CI workflow — runs the same commands as local development
#
# Uses `just ci` to ensure parity between local and CI environments.
# If CI fails, run `just ci` locally to reproduce the issue.
#
# Security (SEC-06 / DDL-bas): every third-party action is pinned to a full
# reviewed commit SHA, and the bd bootstrap tarball is checksum-verified
# against a pinned SHA-256 digest before it is extracted or executed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # full history: the kaya record gates (record-lag) walk commit
          # ranges from the ledger's capture frontier to HEAD
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install ecosystem tools (§4 dogfood matrix, pinned)
        run: |
          cargo install --locked pretender@0.11.1 wai-cli@2026.11.11 dont-cli@0.2.2 testaruda@0.5.9
          npm install -g @fission-ai/openspec@2.1.0
      - name: Install pytest (pinned — python adapter of the DDL-85p test runner)
        run: pip install pytest==9.0.3
      - name: Install kaya (research record compiler, pinned §4 — DDL-csx.5)
        run: |
          tmp=$(mktemp -d)
          curl -fsSL https://github.com/charly-vibes/kaya/releases/download/v0.4.1/kaya_0.4.1_linux_amd64.tar.gz -o "$tmp/kaya.tgz"
          # SEC-06: verify the archive against a pinned SHA-256 digest BEFORE
          # extracting or executing anything from it. Not on crates.io — the
          # fleet-standard GitHub release channel is the pinned mechanism;
          # the versions.ddl.toml pin lands with the SSOT cutover (DDL-csx.7).
          echo "f2d286a8e035a3713a1f2fb6965ffe426e26b5e0c1a28e36ee15d273bf69a565  $tmp/kaya.tgz" | sha256sum -c -
          tar -xzf "$tmp/kaya.tgz" -C "$tmp" kaya
          sudo mv "$tmp/kaya" /usr/local/bin/kaya
      - name: Install bd (beads, pinned §4, checksum-verified)
        run: |
          tmp=$(mktemp -d)
          curl -fsSL https://github.com/gastownhall/beads/releases/download/v1.3.4/beads_1.3.4_linux_amd64.tar.gz -o "$tmp/bd.tgz"
          # SEC-06: verify the archive against a pinned SHA-256 digest BEFORE
          # extracting or executing anything from it. A tampered or truncated
          # download must fail here, not run.
          echo "175c26904bde3ff9168d2282ff6b56f17b17f60c22fa5acb3dacc9fb3465303a  $tmp/bd.tgz" | sha256sum -c -
          # extract only the binary — the tarball also ships README/LICENSE/CHANGELOG
          # which must not clobber the repo checkout
          tar -xzf "$tmp/bd.tgz" -C "$tmp" bd
          sudo mv "$tmp/bd" /usr/local/bin/bd
      # §4 dogfood: installed tools must run, not just install
      - name: Smoke dogfooded tools
        env:
          DO_NOT_TRACK: "1"
        run: |
          bd --version >/dev/null
          wai status >/dev/null
          testaruda --version >/dev/null
          openspec validate --all >/dev/null
          pretender check --mode guidance >/dev/null
          kaya --version >/dev/null
      # DDL-43g: smoke our own live Pages URL. A 404'd book must fail THIS
      # repo's CI immediately, not wait for the next hub conformance run
      # (the turu failure mode). Mirrored in every Pages-deploying sibling.
      - name: Smoke live Pages URL
        run: curl -fsS --max-time 10 --retry 2 https://charly-vibes.github.io/dulce-de-leche/ >/dev/null
      # kaya record gates (DDL-csx.5): warn on pull requests, fail on main —
      # the same `just record-check` developers run locally.
      - name: Run record gates
        run: |
          mode=warn
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then mode=fail; fi
          just record-check "$mode"
      # Run the exact same command as local development
      - name: Run CI pipeline
        run: just ci

      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ddl-linux-amd64
          path: target/release/ddl