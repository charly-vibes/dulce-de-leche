# Pinned ecosystem tool versions for this repo's CI and dev setup.
# Standardization §4: installs are pinned, never `latest` — a broken release
# of any tool must not break CI of the whole fleet.
# Update deliberately; the conformance test (tests/standard_conformance.rs)
# requires this file to exist.
#
# §4 matrix row (ddl): pretender ✅ · wai ✅ · bd ✅ · openspec ✅ · dont ✅
# CI install steps to be wired in the DDL-1a0 install pass.

[tools]
wai = "2026.9.28"          # crates.io: wai-cli
pretender = "0.6.0"        # crates.io
dont = "0.2.2"             # crates.io: dont-cli
dulce-de-leche = "0.7.0"   # crates.io (bin: ddl) — self
openspec = "0.19.0"        # npm: @fission-ai/openspec
# bd = "1.3.0"             # beads — install mechanism TBD (see DDL-1a0)
