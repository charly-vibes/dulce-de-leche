# ─────────────────────────────────────────────────────────────────────
# pretender.toml — dulce-de-leche structural-quality configuration
# ─────────────────────────────────────────────────────────────────────
# CI smoke (ci.yml) runs `pretender check --mode guidance` with the
# pretender@0.7.0 pin. In 0.7.0, gate-by-default is the release default and
# advisory modes (tiered/guidance) require a dated advisory lease — missing
# or expired fails closed (exit 1).
# This toml supplies the lease + repo mode so local runs match CI exactly.
# renewal = push the date forward (reviewable diff) — pretender-1te / DDL-dqr
# convention; horizon matches wai + testaruda.

[pretender]
mode = "guidance"
advisory_until = "2027-03-31"

[roles.test]
paths = ["tests/**", "**/*_test.*", "spec/**"]

[roles.library]
paths = ["pkg/**", "lib/**"]

[roles.script]
paths = ["scripts/**", "examples/**"]

[roles.generated]
paths = ["**/*.pb.go", "**/*_generated.*"]

[roles.vendor]
paths = ["vendor/**", "node_modules/**"]
