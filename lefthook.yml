# lefthook.yml - pre-commit/pre-push gates (§8, DDL-ads)
#
# Install: lefthook install (shims land in core.hooksPath = .beads/hooks)
# Bypass (WIP only): git push --no-verify
#
# The bd hooks run commands chain beads validation — lefthook's shim
# replaces the beads-managed hook scripts, so without this chain the bd
# checks would silently stop running (the DDL-0tp failure mode in wai/genesis).

pre-commit:
  parallel: true
  commands:
    # ddl:managed:start (pre-commit)
    ddl-ah-check:
      run: ah check
    ddl-pretender-gate:
      run: pretender check --diff-only --mode gate
    ddl-spk-lint:
      run: spk lint openspec/specs || test $? -eq 2
    # ddl:managed:end (pre-commit)
# ah:managed:start
    ah-check:
      run: ah check
# ah:managed:end
# sad:managed:start
    sad-check:
      run: sad check
# sad:managed:end
    bd:
      run: bd hooks run pre-commit
    fmt-check:
      glob: "*.rs"
      run: just fmt-check
    lint:
      glob: "*.rs"
      run: just lint
    # Committed-render drift gate (podras dogfood, DDL-3jes): fails when
    # BRIEF.md / BRIEF.json no longer match a regeneration at the render's
    # recorded as-of date. Kept outside the sad:managed block so `sad hooks
    # install/uninstall` never owns it; regenerate renders with
    # `podras brief --write`.
    brief-drift:
      run: scripts/guards/brief-drift.sh
    # kaya record gates (DDL-csx.5): validate the record as STAGED so a bad
    # ledger/projection pair never lands; --index reads the ledger and
    # projections from the git index, not the worktree. Read-only.
    record-verify-staged:
      run: kaya check --index

pre-push:
  commands:
    # ddl:managed:start (pre-push)
    ddl-ah-check:
      run: ah check
    # ddl:managed:end (pre-push)
# sad:managed:start
    sad-check:
      run: sad check
# sad:managed:end
    bd:
      run: bd hooks run pre-push
    gates:
      run: just pre-push
    # kaya record gates (DDL-csx.5): the committed record must verify before
    # it leaves the machine; lag is CI's job (just record-check there).
    record-verify:
      run: just record-verify
